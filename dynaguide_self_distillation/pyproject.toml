[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dynaguide-self-distillation"
version = "0.1.0"
description = "Research code for DynaGuide self-distillation trace collection, training, and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26,<2",
  "torch>=2.1,<2.2"
]

[project.optional-dependencies]
modal = [
  "modal>=1.3"
]

[tool.setuptools.packages.find]
where = ["src"]
